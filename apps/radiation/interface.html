<!-- INTERFACE.HTML - MIT DATEIAUSWAHL -->
<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
    <style>
      .file-list {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid #ccc;
        margin: 10px 0;
        padding: 5px;
      }
      .file-item {
        cursor: pointer;
        padding: 5px;
        border-bottom: 1px solid #eee;
      }
      .file-item:hover {
        background-color: #f0f0f0;
      }
      .file-item.selected {
        background-color: #007bff;
        color: white;
      }
      table {
        font-size: 12px;
        width: 100%;
      }
      th, td {
        padding: 4px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h3>Radiation Data Transfer</h3>
    
    <!-- DATEIAUSWAHL -->
    <div>
      <h4>Dateiauswahl:</h4>
      <div id="fileList" class="file-list">
        <p>Lade Dateiliste...</p>
      </div>
    </div>
    
    <!-- DATENANZEIGE -->
    <div id="data"></div>
    
    <!-- BUTTONS -->
    <div>
      <button class="btn btn-primary" id="btnLoad">Load Data</button>
      <button class="btn btn-success" id="btnSave">Save CSV</button>
      <button class="btn btn-error" id="btnDelete">Delete File</button>
      <button class="btn btn-default" id="btnRefresh">Refresh List</button>
    </div>

    <script src="../../core/lib/interface.js"></script>
    <script>
// === GLOBALE VARIABLEN ===
var dataElement = document.getElementById("data");
var fileListElement = document.getElementById("fileList");
var csvData = "";
var selectedFile = "";
var availableFiles = [];

// === DATEILISTE LADEN ===
function loadFileList() {
  console.log("=== Lade Dateiliste ===");
  
  Util.showModal("Loading file list...");
  
  // RADIATION_LIST.txt laden
  Util.readStorage("RADIATION_LIST.txt", function(data) {
    try {
      if (data && data.length > 0) {
        // Dateiliste parsen
        availableFiles = data.trim().split('\n').filter(line => line.trim() !== "");
        console.log("Gefundene Dateien:", availableFiles.length);
        
        displayFileList();
      } else {
        console.log("Keine Dateiliste gefunden");
        fileListElement.innerHTML = "<p>Keine Dateien gefunden</p>";
        availableFiles = [];
      }
    } catch (e) {
      console.log("Fehler beim Parsen:", e.message);
      fileListElement.innerHTML = "<p>Fehler beim Laden der Dateiliste</p>";
      availableFiles = [];
    }
    
    Util.hideModal();
  });
}

// === DATEILISTE ANZEIGEN ===
function displayFileList() {
  console.log("=== Zeige Dateiliste ===");
  
  if (availableFiles.length === 0) {
    fileListElement.innerHTML = "<p>Keine Dateien verfügbar</p>";
    return;
  }
  
  var html = "";
  for (var i = 0; i < availableFiles.length; i++) {
    var filename = availableFiles[i].trim();
    if (filename.startsWith("RADIATION_") && filename.endsWith(".csv")) {
      html += `<div class="file-item" data-file="${filename}">${filename}</div>`;
    }
  }
  
  fileListElement.innerHTML = html;
  
  // Click-Handler für Dateiauswahl
  var fileItems = document.querySelectorAll('.file-item');
  fileItems.forEach(function(item) {
    item.addEventListener('click', function() {
      // Alle abwählen
      fileItems.forEach(i => i.classList.remove('selected'));
      
      // Dieses auswählen
      this.classList.add('selected');
      selectedFile = this.getAttribute('data-file');
      console.log("Ausgewählt:", selectedFile);
      
      // Automatisch laden
      loadSelectedFile();
    });
  });
  
  // Erste Datei automatisch auswählen
  if (fileItems.length > 0) {
    fileItems[0].classList.add('selected');
    selectedFile = fileItems[0].getAttribute('data-file');
    console.log("Standard-Auswahl:", selectedFile);
  }
}

// === AUSGEWÄHLTE DATEI LADEN ===
function loadSelectedFile() {
  if (!selectedFile) {
    dataElement.innerHTML = "<b>Keine Datei ausgewählt</b>";
    return;
  }
  
  console.log("=== Lade ausgewählte Datei ===");
  console.log("Datei:", selectedFile);
  
  Util.showModal("Loading " + selectedFile + "...");
  
  // Datei laden
  Util.readStorageFile(selectedFile, function(data) {
    try {
      csvData = data ? data.trim() : "";
      
      if (csvData.length === 0) {
        dataElement.innerHTML = "<b>Leere Datei: " + selectedFile + "</b>";
        Util.hideModal();
        return;
      }
      
      // Daten als Tabelle anzeigen
      displayCSVData(csvData);
      
    } catch (e) {
      console.log("Fehler beim Laden:", e.message);
      dataElement.innerHTML = "<b>Fehler beim Laden: " + e.message + "</b>";
    }
    
    Util.hideModal();
  });
}

// === CSV-DATEN ALS TABELLE ANZEIGEN ===
function displayCSVData(data) {
  console.log("=== Zeige CSV-Daten ===");
  
  if (!data || data.length === 0) {
    dataElement.innerHTML = "<b>Keine Daten vorhanden</b>";
    return;
  }
  
  var lines = data.split('\n').filter(line => line.trim() !== "");
  
  if (lines.length === 0) {
    dataElement.innerHTML = "<b>Keine gültigen Daten</b>";
    return;
  }
  
  // Header-Zeile
  var header = lines[0];
  var headerParts = header.split(',');
  
  // Datenzeilen
  var dataLines = lines.slice(1);
  
  // Tabelle erstellen
  var tableHtml = `<table class="table table-striped">
    <thead>
      <tr>`;
  
  // Header
  for (var h = 0; h < headerParts.length; h++) {
    tableHtml += `<th>${headerParts[h].trim()}</th>`;
  }
  tableHtml += `</tr>
    </thead>
    <tbody>`;
  
  // Datenzeilen (max. 50 für Performance)
  var displayLines = Math.min(50, dataLines.length);
  for (var i = 0; i < displayLines; i++) {
    var line = dataLines[i];
    var parts = line.split(',');
    
    tableHtml += `<tr>`;
    for (var j = 0; j < parts.length; j++) {
      tableHtml += `<td>${parts[j].trim()}</td>`;
    }
    tableHtml += `</tr>`;
  }
  
  tableHtml += `</tbody></table>`;
  
  // Info bei vielen Zeilen
  if (dataLines.length > 50) {
    tableHtml += `<p><i>... und ${dataLines.length - 50} weitere Zeilen</i></p>`;
  }
  
  dataElement.innerHTML = tableHtml;
  console.log("Angezeigte Zeilen:", displayLines);
}

// === BUTTON-EVENTS ===
document.getElementById("btnLoad").addEventListener("click", function() {
  if (selectedFile) {
    loadSelectedFile();
  } else {
    alert("Bitte zuerst eine Datei auswählen!");
  }
});

document.getElementById("btnSave").addEventListener("click", function() {
  if (csvData && csvData.length > 0 && selectedFile) {
    var filename = selectedFile.replace(".csv", "");
    Util.saveCSV(filename, csvData);
    console.log("Gespeichert:", filename);
  } else {
    alert("Keine Daten zum Speichern!");
  }
});

document.getElementById("btnDelete").addEventListener("click", function() {
  if (selectedFile) {
    if (confirm("Wirklich löschen: " + selectedFile + "?")) {
      Util.showModal("Deleting " + selectedFile + "...");
      
      Util.eraseStorageFile(selectedFile, function() {
        console.log("Gelöscht:", selectedFile);
        Util.hideModal();
        
        // Liste neu laden
        loadFileList();
        dataElement.innerHTML = "<b>Datei gelöscht: " + selectedFile + "</b>";
        csvData = "";
        selectedFile = "";
      });
    }
  } else {
    alert("Keine Datei zum Löschen!");
  }
});

document.getElementById("btnRefresh").addEventListener("click", function() {
  loadFileList();
});

// === APP START ===
function onInit() {
  console.log("=== Radiation Data Transfer App gestartet ===");
  loadFileList();
}

// === TEST-FUNKTIONEN ===
function testFileLoading() {
  console.log("=== Test File Loading ===");
  
  // Testdaten
  var testData = "time,cpm\n12:30:45,150\n12:31:22,155\n12:32:00,160\n12:33:15,145\n12:34:33,170";
  
  // Simuliere Dateiliste
  var testFiles = [
    "RADIATION_2025-09-27.csv",
    "RADIATION_2025-09-28.csv",
    "RADIATION_2025-09-29.csv"
  ];
  
  console.log("Test mit", testFiles.length, "Dateien");
  availableFiles = testFiles;
  displayFileList();
  
  // Erste Datei laden
  setTimeout(function() {
    selectedFile = testFiles[0];
    csvData = testData;
    displayCSVData(testData);
  }, 1000);
}

// === DEBUGGING ===
function debugInterface() {
  console.log("=== Interface Debug ===");
  console.log("Available Files:", availableFiles.length);
  console.log("Selected File:", selectedFile);
  console.log("CSV Data Length:", csvData.length);
  
  // Test-Output
  console.log("Test Output:");
  console.log("FONT_SIZES:", JSON.stringify(FONT_SIZES));
  console.log("GLOBAL_SETTINGS:", JSON.stringify(GLOBAL_SETTINGS));
}

// === HILFSFUNKTIONEN ===
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function formatDate(filename) {
  try {
    var datePart = filename.replace("RADIATION_", "").replace(".csv", "");
    var parts = datePart.split("-");
    if (parts.length === 3) {
      return parts[2] + "." + parts[1] + "." + parts[0];
    }
  } catch (e) {
    // ignore
  }
  return filename;
}
    </script>
  </body>
</html>
