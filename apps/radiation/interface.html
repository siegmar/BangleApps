<!-- INTERFACE.HTML - MIT RADIATION_LIST.TXT INTEGRATION -->
<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
    <style>
      .file-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        margin: 10px 0;
        padding: 5px;
        background-color: #f8f8f8;
      }
      .file-item {
        cursor: pointer;
        padding: 8px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }
      .file-item:hover {
        background-color: #e0e0e0;
      }
      .file-item.selected {
        background-color: #007bff;
        color: white;
        font-weight: bold;
      }
      table {
        font-size: 12px;
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 4px;
        text-align: left;
        border: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
      }
      .alert-cell {
        background-color: #ffcccc;
        font-weight: bold;
      }
      .status-bar {
        background-color: #000;
        color: #fff;
        padding: 5px;
        font-size: 12px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="status-bar" id="status">Loading file list...</div>
    
    <h3>Radiation Data Transfer</h3>
    
    <!-- DATEI-LISTE AUS RADIATION_LIST.TXT -->
    <div>
      <h4>Available Log Files:</h4>
      <div id="fileList" class="file-list">
        <p>Loading...</p>
      </div>
    </div>
    
    <!-- DATEN-TABELLE -->
    <div id="dataContainer">
      <h4>Data Preview:</h4>
      <div id="data"></div>
    </div>
    
    <!-- BUTTONS -->
    <div style="margin-top: 15px;">
      <button class="btn btn-primary" id="btnLoad">Load Selected File</button>
      <button class="btn btn-success" id="btnSave">Save as CSV</button>
      <button class="btn btn-error" id="btnDelete">Delete File</button>
      <button class="btn btn-default" id="btnRefresh">Refresh List</button>
    </div>

    <script src="../../core/lib/interface.js"></script>
    <script>
// === GLOBALE VARIABLEN ===
var dataElement = document.getElementById("data");
var fileListElement = document.getElementById("fileList");
var statusElement = document.getElementById("status");
var csvData = "";
var selectedFile = "";
var availableFiles = [];
var fileDataCache = {}; // Cache für geladene Dateien

// === STATUS-ANZEIGE ===
function updateStatus(message) {
  statusElement.textContent = message;
  console.log("[STATUS]", message);
}

// === DATEI-LISTE AUS RADIATION_LIST.TXT LADEN ===
function loadRadiationFileList() {
  updateStatus("Loading RADIATION_LIST.txt...");
  
  Util.readStorage("RADIATION_LIST.txt", function(data) {
    try {
      if (data && data.length > 0) {
        // Dateiliste parsen
        availableFiles = data.trim().split('\n')
          .filter(line => line.trim() !== "")
          .filter(filename => filename.startsWith("RADIATION_") && filename.endsWith(".csv"));
        
        availableFiles.sort().reverse(); // Neueste zuerst
        
        updateStatus("Found " + availableFiles.length + " log files");
        displayFileList();
        
      } else {
        updateStatus("No RADIATION_LIST.txt found");
        fileListElement.innerHTML = "<p>No radiation log files found</p>";
        availableFiles = [];
      }
      
    } catch (e) {
      updateStatus("Error reading file list: " + e.message);
      fileListElement.innerHTML = "<p>Error loading file list</p>";
      availableFiles = [];
    }
  });
}

// === DATEI-LISTE ANZEIGEN ===
function displayFileList() {
  if (availableFiles.length === 0) {
    fileListElement.innerHTML = "<p>No log files available</p>";
    return;
  }
  
  var html = "";
  for (var i = 0; i < availableFiles.length; i++) {
    var filename = availableFiles[i];
    var display = filename.replace("RADIATION_", "").replace(".csv", "");
    html += `<div class="file-item" data-file="${filename}">${display}</div>`;
  }
  
  fileListElement.innerHTML = html;
  
  // Click-Handler für Dateiauswahl
  var fileItems = document.querySelectorAll('.file-item');
  fileItems.forEach(function(item) {
    item.addEventListener('click', function() {
      // Alle abwählen
      fileItems.forEach(i => i.classList.remove('selected'));
      
      // Dieses auswählen
      this.classList.add('selected');
      selectedFile = this.getAttribute('data-file');
      updateStatus("Selected: " + selectedFile);
      
      // Automatisch laden
      loadSelectedFile();
    });
  });
  
  // Erste Datei automatisch auswählen
  if (fileItems.length > 0) {
    fileItems[0].classList.add('selected');
    selectedFile = fileItems[0].getAttribute('data-file');
    updateStatus("Auto-selected: " + selectedFile);
  }
}

// === AUSGEWÄHLTE DATEI LADEN ===
function loadSelectedFile() {
  if (!selectedFile) {
    dataElement.innerHTML = "<b>Please select a file first</b>";
    return;
  }
  
  updateStatus("Loading " + selectedFile + "...");
  
  // Prüfen ob bereits im Cache
  if (fileDataCache[selectedFile]) {
    displayCSVData(fileDataCache[selectedFile]);
    updateStatus("Loaded from cache: " + selectedFile);
    return;
  }
  
  // Datei laden
  Util.readStorageFile(selectedFile, function(data) {
    try {
      if (data && data.length > 0) {
        csvData = data.trim();
        fileDataCache[selectedFile] = csvData; // Im Cache speichern
        displayCSVData(csvData);
        updateStatus("Loaded: " + selectedFile);
      } else {
        dataElement.innerHTML = "<b>Empty file: " + selectedFile + "</b>";
        updateStatus("Empty file: " + selectedFile);
        csvData = "";
      }
      
    } catch (e) {
      dataElement.innerHTML = "<b>Error loading file: " + e.message + "</b>";
      updateStatus("Error: " + e.message);
      csvData = "";
    }
  });
}

// === CSV-DATEN ALS TABELLE ANZEIGEN ===
function displayCSVData(data) {
  if (!data || data.length === 0) {
    dataElement.innerHTML = "<b>No data available</b>";
    return;
  }
  
  try {
    var lines = data.split('\n').filter(line => line.trim() !== "");
    
    if (lines.length === 0) {
      dataElement.innerHTML = "<b>No valid data lines</b>";
      return;
    }
    
    // Header-Zeile
    var header = lines[0];
    var headerParts = header.split(',');
    
    // Datenzeilen
    var dataLines = lines.slice(1);
    
    // Tabelle erstellen
    var tableHtml = `<table class="table table-striped">
      <thead>
        <tr>`;
    
    // Header
    for (var h = 0; h < headerParts.length; h++) {
      tableHtml += `<th>${headerParts[h].trim()}</th>`;
    }
    tableHtml += `</tr>
      </thead>
      <tbody>`;
    
    // Erste 20 Datenzeilen (Performance)
    var displayLines = Math.min(20, dataLines.length);
    for (var i = 0; i < displayLines; i++) {
      var line = dataLines[i];
      var parts = line.split(',');
      
      tableHtml += `<tr>`;
      for (var j = 0; j < parts.length; j++) {
        var cellContent = parts[j].trim();
        
        // Alert-Zellen hervorheben (wenn CPM > 35)
        if (j === 1) { // CPM-Spalte
          var cpmValue = parseInt(cellContent) || 0;
          if (cpmValue > 35) {
            tableHtml += `<td class="alert-cell">${cellContent}</td>`;
          } else {
            tableHtml += `<td>${cellContent}</td>`;
          }
        } else {
          tableHtml += `<td>${cellContent}</td>`;
        }
      }
      tableHtml += `</tr>`;
    }
    
    tableHtml += `</tbody></table>`;
    
    // Info bei vielen Zeilen
    if (dataLines.length > 20) {
      tableHtml += `<p><i>... and ${dataLines.length - 20} more lines</i></p>`;
    }
    
    dataElement.innerHTML = tableHtml;
    
  } catch (e) {
    dataElement.innerHTML = "<b>Error displaying data: " + e.message + "</b>";
  }
}

// === BUTTON-EVENTS ===
document.getElementById("btnLoad").addEventListener("click", function() {
  if (selectedFile) {
    loadSelectedFile();
  } else {
    updateStatus("Please select a file first!");
    alert("Please select a file first!");
  }
});

document.getElementById("btnSave").addEventListener("click", function() {
  if (csvData && csvData.length > 0 && selectedFile) {
    var filename = selectedFile.replace(".csv", "");
    Util.saveCSV(filename, csvData);
    updateStatus("Saved: " + filename + ".csv");
  } else {
    updateStatus("No data to save!");
    alert("No data to save!");
  }
});

document.getElementById("btnDelete").addEventListener("click", function() {
  if (selectedFile) {
    if (confirm("Really delete: " + selectedFile + "?")) {
      updateStatus("Deleting " + selectedFile + "...");
      
      Util.eraseStorageFile(selectedFile, function() {
        updateStatus("Deleted: " + selectedFile);
        
        // Aus Cache entfernen
        delete fileDataCache[selectedFile];
        
        // Liste neu laden
        loadRadiationFileList();
        dataElement.innerHTML = "<b>File deleted: " + selectedFile + "</b>";
        csvData = "";
        selectedFile = "";
      });
    }
  } else {
    updateStatus("No file selected!");
    alert("No file selected!");
  }
});

document.getElementById("btnRefresh").addEventListener("click", function() {
  loadRadiationFileList();
  dataElement.innerHTML = "";
  csvData = "";
  selectedFile = "";
  updateStatus("Refreshing file list...");
});

// === APP START ===
function onInit() {
  updateStatus("Initializing Radiation Data Transfer...");
  loadRadiationFileList();
}

// === TEST-FUNKTIONEN ===
function testInterface() {
  updateStatus("Testing interface...");
  
  // Testdaten
  availableFiles = [
    "RADIATION_2025-09-08.csv",
    "RADIATION_2025-09-07.csv",
    "RADIATION_2025-09-06.csv"
  ];
  
  displayFileList();
  
  // Testdaten für CSV
  var testData = "time,cpm\n12:30:45,31\n12:31:22,35\n12:32:00,42\n12:33:15,38\n12:34:33,45";
  csvData = testData;
  displayCSVData(testData);
  
  updateStatus("Test completed");
}

// === DEBUG-FUNKTIONEN ===
function debugFileList() {
  console.log("=== DEBUG FILE LIST ===");
  console.log("Available files:", availableFiles);
  console.log("Selected file:", selectedFile);
  console.log("CSV data length:", csvData.length);
  console.log("Cache entries:", Object.keys(fileDataCache).length);
}

// === HAUPTAUFRUF ===
setTimeout(function() {
  console.log("=== START RADIATION DATA TRANSFER ===");
  onInit();
}, 1000);
    </script>
  </body>
</html>
