<!-- INTERFACE.HTML - MIT VERSIONSNUMMER UND VERBESSERTE FEHLERBEHANDLUNG -->
<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
    <style>
      .version-info {
        font-size: 12px;
        color: #666;
        text-align: right;
        margin: 5px;
      }
      .file-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        margin: 10px 0;
        padding: 5px;
      }
      .file-item {
        cursor: pointer;
        padding: 5px;
        border-bottom: 1px solid #eee;
      }
      .file-item:hover {
        background-color: #f0f0f0;
      }
      .file-item.selected {
        background-color: #007bff;
        color: white;
      }
      table {
        font-size: 12px;
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 4px;
        text-align: left;
        border: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <!-- VERSIONSNUMMER -->
    <div class="version-info">
      Version: V001 - Radiation Data Interface
    </div>
    
    <h3>Radiation Data Transfer</h3>
    
    <!-- DATEI-LISTE -->
    <div>
      <h4>Available Log Files:</h4>
      <div id="fileList" class="file-list">
        <p>Loading...</p>
      </div>
    </div>
    
    <!-- DATEN-ANZEIGE -->
    <div id="data"></div>
    
    <!-- BUTTONS -->
    <div style="margin-top: 15px;">
      <button class="btn btn-primary" id="btnLoad">Load Selected File</button>
      <button class="btn btn-success" id="btnSave">Save as CSV</button>
      <button class="btn btn-error" id="btnDelete">Delete File</button>
      <button class="btn btn-default" id="btnRefresh">Refresh List</button>
    </div>

    <script src="../../core/lib/interface.js"></script>
    <script>
// === GLOBALE VARIABLEN ===
var dataElement = document.getElementById("data");
var fileListElement = document.getElementById("fileList");
var csvData = "";
var selectedFile = "";
var availableFiles = [];

// === VERSIONS-INFORMATION ===
var INTERFACE_VERSION = "V001"; // ? Versionsnummer hinzugefügt!
console.log("=== Radiation Data Interface " + INTERFACE_VERSION + " ===");

// === DATEI-LISTE LADEN MIT VERBESSERTER FEHLERBEHANDLUNG ===
function loadRadiationFileList() {
  console.log("=== Lade Radiation-Dateiliste MIT VERBESSERUNG ===");
  
  Util.showModal("Loading file list...");
  
  // Versuche RADIATION_LIST.txt zu laden
  Util.readStorage("RADIATION_LIST.txt", function(listContent) {
    try {
      if (listContent && listContent.length > 0) {
        // Liste erfolgreich geladen
        console.log("? RADIATION_LIST.txt geladen");
        
        var lines = listContent.split('\n').filter(line => line.trim() !== "");
        var logs = [];
        
        // Nur RADIATION_*.csv Dateien
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.startsWith("RADIATION_") && line.endsWith(".csv")) {
            logs.push(line);
          }
        }
        
        logs.sort().reverse();
        availableFiles = logs;
        
        Util.hideModal();
        displayFileList();
        
      } else {
        // Liste leer oder nicht gefunden - ALTERNATIVE Methode
        console.log("? RADIATION_LIST.txt nicht gefunden - verwende ALTERNATIVE Methode");
        
        // ALLE Dateien auflisten und filtern
        var allFiles = require("Storage").list();
        var logs = [];
        
        for (var j = 0; j < allFiles.length; j++) {
          var f = allFiles[j];
          if (typeof f === 'string') {
            if (f.startsWith("RADIATION_") && f.endsWith(".csv")) {
              logs.push(f);
            }
          }
        }
        
        logs.sort().reverse();
        availableFiles = logs;
        
        Util.hideModal();
        displayFileList();
        
        // Warnung anzeigen
        if (logs.length === 0) {
          E.showMessage("Keine RADIATION-Dateien\\ngefunden", "Warnung");
          setTimeout(function() {
            showLogFileMenu();
          }, 2000);
        }
      }
      
    } catch (e) {
      console.log("? Fehler beim Laden der Liste:", e.message);
      Util.hideModal();
      
      // Fallback: Alle Dateien auflisten
      var allFiles = require("Storage").list();
      var logs = [];
      
      for (var k = 0; k < allFiles.length; k++) {
        var f = allFiles[k];
        if (typeof f === 'string') {
          if (f.startsWith("RADIATION_") && f.endsWith(".csv")) {
            logs.push(f);
          }
        }
      }
      
      logs.sort().reverse();
      availableFiles = logs;
      
      displayFileList();
      
      if (logs.length === 0) {
        E.showMessage("Keine Dateien\\ngefunden", "Fehler");
        setTimeout(showLogFileMenu, 2000);
      }
    }
  });
}

// === DATEI-LISTE ANZEIGEN ===
function displayFileList() {
  if (availableFiles.length === 0) {
    fileListElement.innerHTML = "<p>Keine Log-Dateien gefunden</p>";
    return;
  }
  
  var html = "";
  for (var i = 0; i < availableFiles.length; i++) {
    var filename = availableFiles[i];
    var display = filename.replace("RADIATION_", "").replace(".csv", "");
    html += `<div class="file-item" data-file="${filename}">${display}</div>`;
  }
  
  fileListElement.innerHTML = html;
  
  // Click-Handler
  var fileItems = document.querySelectorAll('.file-item');
  fileItems.forEach(function(item) {
    item.addEventListener('click', function() {
      // Alle abwählen
      fileItems.forEach(i => i.classList.remove('selected'));
      
      // Dieses auswählen
      this.classList.add('selected');
      selectedFile = this.getAttribute('data-file');
      
      // Automatisch laden
      loadSelectedFile();
    });
  });
  
  // Erste Datei auswählen
  if (fileItems.length > 0) {
    fileItems[0].classList.add('selected');
    selectedFile = fileItems[0].getAttribute('data-file');
  }
}

// === AUSGEWÄHLTE DATEI LADEN ===
function loadSelectedFile() {
  if (!selectedFile) {
    dataElement.innerHTML = "<b>Bitte Datei auswählen</b>";
    return;
  }
  
  Util.showModal("Loading " + selectedFile + "...");
  
  Util.readStorageFile(selectedFile, function(data) {
    try {
      if (data && data.length > 0) {
        csvData = data.trim();
        displayCSVData(csvData);
      } else {
        dataElement.innerHTML = "<b>Leere Datei: " + selectedFile + "</b>";
        csvData = "";
      }
    } catch (e) {
      dataElement.innerHTML = "<b>Fehler beim Laden: " + e.message + "</b>";
      csvData = "";
    }
    
    Util.hideModal();
  });
}

// === CSV-DATEN ANZEIGEN ===
function displayCSVData(data) {
  if (!data || data.length === 0) {
    dataElement.innerHTML = "<b>Keine Daten vorhanden</b>";
    return;
  }
  
  try {
    var lines = data.split('\n').filter(line => line.trim() !== "");
    
    if (lines.length === 0) {
      dataElement.innerHTML = "<b>Keine gültigen Daten</b>";
      return;
    }
    
    // Header
    var header = lines[0];
    var headerParts = header.split(',');
    
    // Datenzeilen
    var dataLines = lines.slice(1);
    
    // Tabelle erstellen
    var tableHtml = `<table class="table table-striped">
      <thead>
        <tr>`;
    
    // Header-Zeilen
    for (var h = 0; h < headerParts.length; h++) {
      tableHtml += `<th>${headerParts[h].trim()}</th>`;
    }
    tableHtml += `</tr>
      </thead>
      <tbody>`;
    
    // Erste 20 Datenzeilen
    var displayLines = Math.min(20, dataLines.length);
    for (var i = 0; i < displayLines; i++) {
      var line = dataLines[i];
      var parts = line.split(',');
      
      tableHtml += `<tr>`;
      for (var j = 0; j < parts.length; j++) {
        tableHtml += `<td>${parts[j].trim()}</td>`;
      }
      tableHtml += `</tr>`;
    }
    
    tableHtml += `</tbody></table>`;
    
    // Mehr anzeigen wenn nötig
    if (dataLines.length > 20) {
      tableHtml += `<p><i>... und ${dataLines.length - 20} weitere Zeilen</i></p>`;
    }
    
    dataElement.innerHTML = tableHtml;
    
  } catch (e) {
    dataElement.innerHTML = "<b>Fehler beim Anzeigen: " + e.message + "</b>";
  }
}

// === BUTTON-EVENTS ===
document.getElementById("btnLoad").addEventListener("click", function() {
  if (selectedFile) {
    loadSelectedFile();
  } else {
    alert("Bitte Datei auswählen!");
  }
});

document.getElementById("btnSave").addEventListener("click", function() {
  if (csvData && csvData.length > 0 && selectedFile) {
    var filename = selectedFile.replace(".csv", "");
    Util.saveCSV(filename, csvData);
  } else {
    alert("Keine Daten zum Speichern!");
  }
});

document.getElementById("btnDelete").addEventListener("click", function() {
  if (selectedFile) {
    if (confirm("Wirklich löschen: " + selectedFile + "?")) {
      Util.showModal("Deleting...");
      
      Util.eraseStorageFile(selectedFile, function() {
        // Aus Liste entfernen
        var index = availableFiles.indexOf(selectedFile);
        if (index !== -1) {
          availableFiles.splice(index, 1);
        }
        
        // Liste neu anzeigen
        displayFileList();
        dataElement.innerHTML = "<b>Gelöscht: " + selectedFile + "</b>";
        csvData = "";
        selectedFile = "";
        
        Util.hideModal();
      });
    }
  } else {
    alert("Keine Datei zum Löschen!");
  }
});

document.getElementById("btnRefresh").addEventListener("click", function() {
  loadRadiationFileList();
});

// === APP START MIT VERSIONSANZEIGE ===
function onInit() {
  console.log("=== START RADIATION DATA INTERFACE " + INTERFACE_VERSION + " ===");
  
  // Versionsanzeige
  var versionElement = document.querySelector('.version-info');
  if (versionElement) {
    versionElement.textContent = "Version: " + INTERFACE_VERSION + " - Radiation Data Interface";
  }
  
  loadRadiationFileList();
}

// === TEST-FUNKTIONEN ===
function testInterfaceVersion() {
  console.log("=== TEST INTERFACE VERSION " + INTERFACE_VERSION + " ===");
  
  // Testdaten
  var testData = "time,cpm\n12:30:45,31\n12:31:22,35\n12:32:00,42\n12:33:15,38\n12:34:33,45";
  csvData = testData;
  displayCSVData(testData);
}

// === HAUPTAUFRUF ===
setTimeout(function() {
  console.log("=== START RADIATION DATA INTERFACE " + INTERFACE_VERSION + " ===");
  onInit();
}, 1000);
    </script>
  </body>
</html>
