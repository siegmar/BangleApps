<!-- KLEINE INTERFACE.HTML - NUR RADIATION_LIST.TXT LADEN -->
<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
  </head>
  <body>
    <h3>Radiation List Loader</h3>
    <div id="fileList"></div>
    <button class="btn btn-primary" id="btnLoad">Load List</button>
    <button class="btn btn-default" id="btnRefresh">Refresh</button>

    <script src="../../core/lib/interface.js"></script>
    <script>
// === KLEINE VERSION MIT RADIATION_LIST.TXT ===
var fileListElement = document.getElementById("fileList");
var availableFiles = [];

// RADIATION_LIST.txt laden
function loadRadiationList() {
  console.log("=== Lade RADIATION_LIST.txt ===");
  
  Util.showModal("Loading...");
  
  Util.readStorage("RADIATION_LIST.txt", function(data) {
    try {
      Util.hideModal();
      
      if (data && data.length > 0) {
        console.log("? RADIATION_LIST.txt geladen");
        
        // Liste parsen
        var lines = data.split('\n').filter(line => line.trim() !== "");
        var logs = [];
        
        // Nur RADIATION_*.csv Dateien
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.startsWith("RADIATION_") && line.endsWith(".csv")) {
            logs.push(line);
          }
        }
        
        logs.sort().reverse();
        availableFiles = logs;
        
        displayFileList();
        
      } else {
        console.log("? Leere RADIATION_LIST.txt");
        fileListElement.innerHTML = "<p>Keine Dateien gefunden</p>";
        availableFiles = [];
      }
      
    } catch (e) {
      Util.hideModal();
      console.log("? Fehler:", e.message);
      fileListElement.innerHTML = "<p>Fehler: " + e.message + "</p>";
      availableFiles = [];
    }
  });
}

// Dateiliste anzeigen
function displayFileList() {
  console.log("=== Zeige Dateiliste ===");
  console.log("Dateien:", availableFiles.length);
  
  if (availableFiles.length === 0) {
    fileListElement.innerHTML = "<p>Keine Log-Dateien gefunden</p>";
    return;
  }
  
  var html = "<h4>Verfügbare Dateien:</h4><ul>";
  for (var i = 0; i < availableFiles.length; i++) {
    var filename = availableFiles[i];
    var display = filename.replace("RADIATION_", "").replace(".csv", "");
    html += "<li>" + display + "</li>";
  }
  html += "</ul>";
  
  fileListElement.innerHTML = html;
}

// Button-Events
document.getElementById("btnLoad").addEventListener("click", function() {
  loadRadiationList();
});

document.getElementById("btnRefresh").addEventListener("click", function() {
  loadRadiationList();
});

// App starten
//  console.log("=== START RADIATION LIST LOADER ===");
  
function onInit() {
 loadRadiationList();
}
    </script>
  </body>
</html>
