<!-- INTERFACE.HTML - FÜR RADIATION_LIST.TXT -->
<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
    <style>
      table {
        font-size: 12px;
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 4px;
        text-align: left;
        border: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
      }
      .file-item {
        cursor: pointer;
        padding: 5px;
        border-bottom: 1px solid #eee;
      }
      .file-item:hover {
        background-color: #f0f0f0;
      }
      .file-item.selected {
        background-color: #007bff;
        color: white;
      }
    </style>
  </head>
  <body>
    <h3>Radiation File List 1</h3>
    <div id="data"></div>
    <button class="btn btn-primary" id="btnLoad">Load List</button>
    <button class="btn btn-success" id="btnSave">Save List</button>
    <button class="btn btn-error" id="btnDelete">Delete Selected</button>
    <button class="btn btn-default" id="btnRefresh">Refresh</button>

    <script src="../../core/lib/interface.js"></script>
    <script>
// === GLOBALE VARIABLEN ===
var dataElement = document.getElementById("data");
var listData = "";
var selectedFile = "";

// === LISTE LADEN ===
function getData() {
  // show loading window
  Util.showModal("Loading RADIATION_LIST.txt...");
  
  // get the data
  dataElement.innerHTML = "";
  
  Util.readStorage("RADIATION_LIST.txt", function(data) {
    listData = data ? data.trim() : "";
    
    // remove window
    Util.hideModal();
    
    // If no data, report it and exit
    if (!listData || listData.length == 0) {
      dataElement.innerHTML = "<b>No file list found</b>";
      return;
    }
    
    // Otherwise parse the list and output it as a table
    var lines = listData.split('\n').filter(line => line.trim() !== "");
    
    if (lines.length === 0) {
      dataElement.innerHTML = "<b>Empty file list</b>";
      return;
    }
    
    // Create clickable file list
    var tableHtml = `<table class="table table-striped">
      <thead>
        <tr>
          <th>Select</th>
          <th>Filename</th>
        </tr>
      </thead>
      <tbody>`;
    
    for (var i = 0; i < lines.length; i++) {
      var filename = lines[i].trim();
      if (filename.startsWith("RADIATION_") && filename.endsWith(".csv")) {
        tableHtml += `<tr class="file-item" data-file="${filename}">
          <td><input type="radio" name="fileSelect" value="${filename}"></td>
          <td>${filename.replace("RADIATION_", "").replace(".csv", "")}</td>
        </tr>`;
      }
    }
    
    tableHtml += `</tbody></table>`;
    dataElement.innerHTML = tableHtml;
    
    // Add click handlers
    var fileItems = document.querySelectorAll('.file-item');
    fileItems.forEach(function(item) {
      item.addEventListener('click', function() {
        selectedFile = this.getAttribute('data-file');
        console.log("Selected:", selectedFile);
        
        // Highlight selection
        fileItems.forEach(i => i.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
    
    // Select first file by default
    if (fileItems.length > 0) {
      selectedFile = fileItems[0].getAttribute('data-file');
      fileItems[0].classList.add('selected');
    }
  });
}

// === LISTE SPEICHERN ===
document.getElementById("btnSave").addEventListener("click", function() {
  if (listData && listData.length > 0) {
    Util.saveCSV("RADIATION_LIST", listData);
  } else {
    alert("No list data to save!");
  }
});

// === DATEI LÖSCHEN ===
document.getElementById("btnDelete").addEventListener("click", function() {
  if (selectedFile) {
    if (confirm("Delete file: " + selectedFile + "?")) {
      Util.showModal("Deleting " + selectedFile + "...");
      
      Util.eraseStorageFile(selectedFile, function() {
        Util.hideModal();
        getData(); // Refresh list
      });
    }
  } else {
    alert("Please select a file first!");
  }
});

// === LISTE NEU LADEN ===
document.getElementById("btnLoad").addEventListener("click", function() {
  getData();
});

// === LISTE AKTUALISIEREN ===
document.getElementById("btnRefresh").addEventListener("click", function() {
  getData();
});

// === BEIM APP-START ===
function onInit() {
  getData();
}


    </script>
  </body>
</html>
